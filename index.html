<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Trolley — Functional Prototype</title>
  <style>
    :root { --bg:#f3f5f7; --surface:#fff; --surface2:#eef2f5; --text:#17202a; --muted:#687680; --border:#d9e0e5; --blue:#00539f; --blue-dark:#003b73; --blue-light:#0078d4; --green:#087f5b; --orange:#b66a00; --red:#d81927; --shadow:0 12px 35px rgba(0,0,0,.08); }
    [data-theme="dark"] { --bg:#10161b; --surface:#192127; --surface2:#222c33; --text:#f3f6f8; --muted:#aab5bd; --border:#303b43; --blue:#4ca5ff; --blue-dark:#1769a8; --blue-light:#78bdff; --green:#42c69a; --orange:#f2b45d; --red:#ff5964; --shadow:0 12px 35px rgba(0,0,0,.35); }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:.2s background,.2s color} button,input{font:inherit} button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;padding:22px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}.logo{color:var(--blue);font-size:28px;font-weight:900;letter-spacing:-1.5px}.eyebrow{margin:2px 0 22px;color:var(--muted);font-size:11px;letter-spacing:.08em}.nav{display:grid;gap:5px}.nav button{border:0;border-radius:9px;padding:10px 11px;text-align:left;background:transparent;color:var(--text)}.nav button:hover,.nav button.active{background:rgba(0,120,212,.12);color:var(--blue)}.side-foot{margin-top:auto;padding-top:15px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
    main{width:min(1260px,100%);margin:auto;padding:18px 24px 118px}.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 13px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.035);font-size:13px}.status strong{font-size:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:5px}.battery{margin-left:auto;color:var(--green);font-weight:800}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 17px}.header h1{margin:0;font-size:28px;letter-spacing:-.7px}.sub{color:var(--muted);margin-top:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 9px}.card h2{font-size:18px}.muted{color:var(--muted)}.hero{padding:27px;background:linear-gradient(120deg,var(--blue),var(--blue-light));border:2px solid var(--blue-dark);border-radius:15px;color:#fff;box-shadow:var(--shadow)}.hero h2{margin:0;font-size:27px}.hero p{max-width:660px;margin:7px 0 18px;color:#fff}.btn{border:2px solid var(--blue-dark);border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:750;transition:filter .15s ease,transform .08s ease,background .15s ease}.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}.btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}.btn.secondary:hover{background:var(--surface2);filter:none}.btn.green{background:var(--green);border-color:var(--green)}.btn.danger{background:var(--red);border-color:var(--red)}[data-theme="dark"] .btn:not(.secondary):hover{filter:brightness(.78)}[data-theme="dark"] .btn.secondary:hover{background:var(--surface2);border-color:var(--muted)}
    .row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.list{margin-top:7px}.pill{display:inline-block;padding:4px 8px;background:rgba(0,120,212,.12);color:var(--blue);border-radius:999px;font-size:12px;font-weight:750}.pill.green{background:rgba(8,127,91,.13);color:var(--green)}.pill.orange{background:rgba(182,106,0,.13);color:var(--orange)}.big{font-size:31px;font-weight:900}.total{font-size:23px;font-weight:900}.actions{display:flex;flex-wrap:wrap;gap:8px}.input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}.notice{margin-top:14px;padding:13px;border-left:4px solid var(--orange);border-radius:8px;background:rgba(182,106,0,.1)}.ok{margin-top:14px;padding:13px;border-left:4px solid var(--green);border-radius:8px;background:rgba(8,127,91,.1)}
    .map{height:280px;position:relative;overflow:hidden;border:1px solid var(--border);border-radius:11px;background:repeating-linear-gradient(90deg,transparent 0 62px,rgba(0,120,212,.07) 62px 64px),repeating-linear-gradient(0deg,transparent 0 49px,rgba(0,120,212,.07) 49px 51px)}.aisle{position:absolute;border:2px solid var(--blue);color:var(--blue);border-radius:7px;padding:5px;font-size:11px;font-weight:800}.a1{left:10%;top:14%;width:18%;height:69%}.a2{left:41%;top:14%;width:18%;height:69%}.a3{left:72%;top:14%;width:18%;height:69%}.you{position:absolute;left:48%;top:48%;width:20px;height:20px;border:3px solid white;border-radius:50%;background:var(--red);box-shadow:0 0 0 7px rgba(216,25,39,.2)}.route-line{position:absolute;left:51%;top:54%;width:31%;border-top:4px dashed var(--green);transform:rotate(-30deg);transform-origin:left}.receipt{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.receipt .row{font-family:inherit}.qr{margin:16px auto;display:grid;grid-template-columns:repeat(13,12px);width:max-content;gap:1px;padding:10px;background:#fff;border:1px solid #ddd}.qr i{display:block;width:12px;height:12px;background:#111}.qr i:nth-child(3n),.qr i:nth-child(7n){background:transparent}.exit-hero{text-align:center;padding:24px;background:rgba(8,127,91,.12);border:2px solid var(--green);border-radius:14px}.exit-hero h2{color:var(--green);font-size:25px}.check{color:var(--green);font-weight:800}.fail{color:var(--red);font-weight:800}.bottom{position:fixed;z-index:5;bottom:0;left:244px;right:0;padding:10px 24px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}.bottom .summary{margin-right:auto;font-weight:800}.toast{display:none;position:fixed;z-index:10;right:20px;bottom:82px;padding:12px 15px;border-radius:10px;background:var(--text);color:var(--bg);box-shadow:var(--shadow)}
    @media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:15px}.nav{grid-template-columns:repeat(3,1fr)}.side-foot{display:none}main{padding:14px 14px 130px}.grid,.grid3{grid-template-columns:1fr}.header h1{font-size:24px}.battery{margin-left:0}.bottom{left:0;padding:9px 12px;overflow:auto}.bottom .summary{display:none}.bottom .btn{padding:9px 10px;white-space:nowrap}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="logo">smart trolley</div><div class="eyebrow">RETAIL TECH · PROTOTYPE</div><div id="nav" class="nav"></div><div class="side-foot">📍 Demo Store<br><br>Sample member account<br><b>ST-428-019</b></div></aside>
  <main><div id="status"></div><div id="screen"></div></main>
</div>
<div id="bottom" class="bottom"></div><div id="toast" class="toast"></div>
<script>
const products=[
  {name:'Corn Flakes',emoji:'🥣',price:2.50,aisle:'Breakfast',detail:'Camera detected · Barcode confirmed · +0.48 kg'},
  {name:'Semi-Skimmed Milk',emoji:'🥛',price:1.60,aisle:'Dairy',detail:'Barcode confirmed · +1.03 kg'},
  {name:'Chicken Breast',emoji:'🍗',price:5.50,aisle:'Meat',detail:'Camera detected · Barcode confirmed · +0.62 kg'},
  {name:'Pasta',emoji:'🍝',price:1.50,aisle:'Grocery',detail:'Barcode confirmed · +0.50 kg'},
  {name:'Apples',emoji:'🍎',price:1.24,aisle:'Produce',detail:'Camera detected 2 apples · Scale suggests 3'},
  {name:'Orange Juice',emoji:'🧃',price:2.20,aisle:'Drinks',detail:'Barcode confirmed · +1.05 kg'}
];
const state={page:'home',theme:localStorage.getItem('smartTrolleyTheme')||'light',active:true,details:false,mismatch:true,apples:2,route:'fast',routeStarted:false,parking:'B428',parkingSaved:'18:42 today',shared:false,paid:false,verified:false,exitUsed:false,lowBattery:false};
document.documentElement.dataset.theme=state.theme;
const pages=[['home','🏠 Home'],['route','🗺️ Route'],['basket','🛒 Basket'],['offers','🏷️ Offers'],['pay','💳 Pay & receipt'],['exit','🚪 Exit'],['car','🚗 Find car']];
function money(n){return '£'+n.toFixed(2)} function subtotal(){return products.reduce((s,p)=>s+p.price,0)} function savings(){return 1.90} function total(){return subtotal()-savings()} function count(){return products.length+state.apples-2}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2400)}
function go(p){state.page=p;render()} function theme(){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('smartTrolleyTheme',state.theme);document.documentElement.dataset.theme=state.theme;render()}
function nav(){document.getElementById('nav').innerHTML=pages.map(([id,label])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')+`<button onclick="theme()">◐ ${state.theme==='dark'?'Light':'Dark'} mode</button>`}
function status(){document.getElementById('status').innerHTML=`<div class="status"><strong><span class="dot"></span>Smart Trolley Active</strong><span>Clubcard connected ✓</span><span>🛒 ${count()} items</span><span><b>${money(total())}</b></span><span>📍 Aisle 4 · accuracy 2.3 m</span><span class="battery">🔋 ${state.lowBattery?'18% — return to charge':'84% · ~6 hrs'}</span></div>`}
function header(title,sub=''){return `<div class="header"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><button class="btn secondary" onclick="go('home')">Home</button></div>`}
function home(){return `${header('Smart Trolley','A touchscreen shopping companion for this visit')}<section class="hero"><h2>🛒 Shop smarter.</h2><p>Navigate the store, keep a verified live basket, use Clubcard offers, pay on the trolley and exit with one secure pass.</p><div class="actions"><button class="btn" onclick="go('route')">Start shopping route</button><button class="btn secondary" onclick="state.lowBattery=!state.lowBattery;render()">Demo battery alert</button></div></section><div class="grid" style="margin-top:16px"><div class="card"><h2>Clubcard & savings</h2><div class="big">12,840</div><div class="muted">Clubcard points · £126.40 in vouchers</div><div class="ok">You have saved <b>£1.90</b> today through Clubcard prices.</div></div><div class="card"><h2>Today's parking memory</h2><p class="muted">Stored for this shopping session/day only, then automatically forgotten.</p><div class="actions"><input class="input" id="parking" value="${state.parking}" aria-label="Parking space"><button class="btn secondary" onclick="state.parking=document.getElementById('parking').value||'B428';toast('Parking space saved for today')">Save</button></div><p>🚗 Space <b>${state.parking}</b> · saved ${state.parkingSaved}</p></div></div><div class="grid3" style="margin-top:16px"><div class="card"><h3>📍 Indoor position</h3><span class="pill green">Excellent</span><p class="muted">Aisle 4 · 2.3 m accuracy<br>BLE/UWB/marker simulation.</p></div><div class="card"><h3>👥 Shared basket</h3><p class="muted">${state.shared?'Steven’s phone connected ✓':'Invite another shopper to add list items.'}</p><button class="btn secondary" onclick="state.shared=!state.shared;toast(state.shared?'Shared basket connected':'Shared basket disconnected');render()">${state.shared?'Disconnect':'Connect shopper'}</button></div><div class="card"><h3>🔋 Trolley health</h3><p class="muted">${state.lowBattery?'Battery low — please return to a charging bay after shopping.':'84% battery · approximately six hours remaining.'}</p></div></div>`}
function route(){const modes={fast:['⚡ Fastest','11 min','420 m'],offers:['💷 Best for offers','13 min','510 m'],walk:['🚶 Least walking','15 min','360 m'],list:['🧭 Follow shopping list','12 min','440 m']};const m=modes[state.route];return `${header('Shopping route','Choose how the trolley optimises your trip')}<div class="grid"><div class="card"><h2>Route mode</h2><div class="list">${Object.entries(modes).map(([id,x])=>`<div class="row"><span><b>${x[0]}</b><br><span class="muted">${x[1]} · ${x[2]}</span></span><button class="btn ${state.route===id?'':'secondary'}" onclick="state.route='${id}';render()">${state.route===id?'Selected':'Choose'}</button></div>`).join('')}</div><div class="ok">Next stop: <b>Produce, Aisle 2</b><br><span class="muted">Positioning is excellent. The route will recalculate as the basket changes.</span></div><br><button class="btn" onclick="state.routeStarted=true;toast('Navigation started');render()">${state.routeStarted?'Continue navigation':'Start navigation'}</button></div><div class="card"><h2>${m[0]}</h2><div class="map"><div class="aisle a1">Aisles 1–4</div><div class="aisle a2">Aisles 5–9</div><div class="aisle a3">Aisles 10–14</div><div class="you"></div><div class="route-line"></div></div><p><span class="pill">You are here</span> &nbsp; <span class="pill green">Next: Produce</span></p><p class="muted">Estimated time ${m[1]} · Distance ${m[2]}</p></div></div>`}
function basket(){return `${header('Your basket','Barcode, camera and basket-scale simulation')}<div class="grid"><div class="card"><h2>Live basket</h2><div class="list">${products.map((p,i)=>`<div class="row"><span>${p.emoji} <b>${p.name}${p.name==='Apples'?` × ${state.apples}`:''}</b><br>${state.details?`<span class="muted">${p.detail}</span>`:''}</span><b>${money(p.name==='Apples'?state.apples*.62:p.price)}</b></div>`).join('')}</div><br><div class="actions"><button class="btn secondary" onclick="state.details=!state.details;render()">${state.details?'Hide':'How was this added?'}</button><button class="btn secondary" onclick="toast('Camera scan simulated: item recognised')">Simulate scan</button></div></div><div class="card"><h2>Basket confidence</h2><div class="row"><span>📷 Camera recognition</span><span class="check">✓ matched</span></div><div class="row"><span>⚖️ Scale reading</span><span class="check">✓ matched</span></div><div class="row"><span>🏷️ Barcode scans</span><span class="check">✓ confirmed</span></div>${state.mismatch?`<div class="notice"><b>⚠ Something doesn't look right</b><p>Camera detected <b>2 apples</b>, but the basket weight suggests <b>3</b>.</p><div class="actions"><button class="btn" onclick="state.apples=3;state.mismatch=false;toast('3 apples confirmed');render()">Confirm 3 apples</button><button class="btn secondary" onclick="state.details=true;render()">Review basket</button></div></div>`:`<div class="ok"><b>✓ Basket data agrees</b><br>All scanned items and scale readings match.</div>`}<hr style="border:0;border-top:1px solid var(--border);margin:17px 0"><div class="row"><span>Clubcard savings</span><b>−${money(savings())}</b></div><div class="row total"><span>Total</span><span>${money(total())}</span></div><br><button class="btn" onclick="go('pay')">Continue to payment</button></div></div>`}
function offers(){return `${header('Potential savings','Offers that can shape the route as well as the basket')}<div class="grid"><div class="card"><h2>💷 You could save £1.20 more</h2><p class="muted">Add one selected pasta sauce to unlock the 3-for-£4 offer.</p><div class="big">£1.90</div><div class="muted">saved so far today</div><br><button class="btn" onclick="state.route='offers';toast('Offer added to your route');go('route')">Add to route</button></div><div class="card"><h2>Available Clubcard prices</h2><div class="list"><div class="row"><span><b>Cereal Clubcard Price</b><br><span class="muted">Corn Flakes</span></span><b>Save 50p</b></div><div class="row"><span><b>Chicken Clubcard Price</b><br><span class="muted">Chicken Breast</span></span><b>Save £1.00</b></div><div class="row"><span><b>Fruit offer</b><br><span class="muted">Selected apples</span></span><b>Save 40p</b></div></div></div></div>`}
function pay(){return `${header('Pay & live receipt','Review before producing an exit pass')}<div class="grid"><div class="card receipt"><h2>TESCO</h2><div class="muted">Smart Trolley Receipt</div><br>${products.map(p=>`<div class="row"><span>${p.name}${p.name==='Apples'?` × ${state.apples}`:''}</span><span>${money(p.name==='Apples'?state.apples*.62:p.price)}</span></div>`).join('')}<div class="row"><span>Clubcard savings</span><span>-${money(savings())}</span></div><div class="row total"><span>TOTAL</span><span>${money(total())}</span></div><div class="row"><span>Clubcard points</span><span>+${Math.round(total())}</span></div><br><span class="pill green">${state.paid?'Paid by Smart Pay ✓':'Awaiting payment'}</span></div><div class="card"><h2>Payment & verification</h2><p class="muted">The exit pass activates only after payment and basket verification.</p><div class="row"><span>💳 Smart Pay</span><span class="${state.paid?'check':'muted'}">${state.paid?'✓ paid':'Ready'}</span></div><div class="row"><span>🪪 Age checks</span><span class="check">✓ none required</span></div><div class="row"><span>🧾 Basket contents</span><span class="${state.mismatch?'fail':'check'}">${state.mismatch?'Needs review':'✓ matched'}</span></div><br><button class="btn ${state.mismatch?'secondary':''}" onclick="if(state.mismatch){toast('Resolve the apple check before payment');go('basket')}else{state.paid=true;state.verified=true;toast('Payment complete — exit pass ready');render()}">${state.paid?'Payment complete':'Pay £'+total().toFixed(2)}</button><div class="ok"><b>Receipt choices</b><br><br><div class="actions"><button class="btn secondary" onclick="toast('Full receipt opened')">View full receipt</button><button class="btn secondary" onclick="toast('Receipt email queued')">Email receipt</button></div></div></div></div>`}
function exit(){const ready=state.paid&&state.verified&&!state.exitUsed;return `${header('Exit verification','Your pass remains linked to this trolley shopping session until end of trading day')}<div class="exit-hero"><h2>${state.exitUsed?'✓ EXIT VERIFIED':ready?'🟢 READY TO EXIT':'⚠ ASSISTANCE REQUIRED'}</h2><p>${state.exitUsed?'Thank you for shopping at Tesco. Your exit pass has now been used.':ready?'Your basket has been paid for and verified. Present this pass at the exit gate.':'Complete payment and resolve any basket checks before exiting.'}</p>${ready?`<div class="qr">${Array.from({length:169},()=>'<i></i>').join('')}</div><b>ST-428-019-${new Date().toISOString().slice(0,10).replaceAll('-','')}</b><p class="muted">Valid today · unique to this completed shopping session</p><button class="btn green" onclick="state.exitUsed=true;toast('Exit scanner accepted your pass');render()">Simulate exit gate scan</button>`:''}</div><div class="grid3" style="margin-top:16px"><div class="card"><h3>📷 Camera</h3><span class="${ready||state.exitUsed?'check':'fail'}">${ready||state.exitUsed?'✓ verified':'Pending'}</span></div><div class="card"><h3>⚖️ Weight</h3><span class="${ready||state.exitUsed?'check':'fail'}">${ready||state.exitUsed?'✓ verified':'Pending'}</span></div><div class="card"><h3>💳 Payment</h3><span class="${state.paid?'check':'fail'}">${state.paid?'✓ verified':'Pending'}</span></div></div>`}
function car(){return `${header('Find your car','Parking space is only held for today’s shopping session')}<div class="grid"><div class="card"><h2>🚗 Your car</h2><div class="big">${state.parking}</div><p class="muted">Saved ${state.parkingSaved}. This is automatically removed after the day/session.</p><div class="actions"><button class="btn" onclick="toast('Walking route to car started')">Navigate to car</button><button class="btn secondary" onclick="state.parking='—';toast('Parking space forgotten');render()">Forget parking space</button></div></div><div class="card"><h2>Car park route</h2><div class="map"><div class="aisle a1">Entrance</div><div class="aisle a2">Level B</div><div class="aisle a3">Space ${state.parking}</div><div class="you"></div><div class="route-line"></div></div><p class="muted">About 2 minutes’ walk from the exit.</p></div></div>`}
function render(){nav();status();document.getElementById('screen').innerHTML=({home,route,basket,offers,pay,exit,car})[state.page]();document.getElementById('bottom').innerHTML=`<span class="summary">🛒 ${count()} items · ${money(total())} · <span class="check">● ACTIVE</span></span><button class="btn secondary" onclick="go('basket')">Basket</button><button class="btn secondary" onclick="go('route')">Route</button><button class="btn secondary" onclick="go('offers')">Offers</button><button class="btn" onclick="go('pay')">Checkout</button>`}
render();
</script>
<script>
/* Prototype interaction layer: keeps the original visual design but makes the
   shopping flow usable end-to-end without a backend or payment provider. */
products.forEach(p => p.qty = p.name === 'Apples' ? 2 : 1);
Object.assign(state, { routeStep:0, scanIndex:0, offerAdded:false, receiptSent:false, carRoute:false });

function persist(){
  localStorage.setItem('smartTrolleyPrototype', JSON.stringify({
    qty: products.map(p=>p.qty), parking:state.parking, shared:state.shared,
    route:state.route, offerAdded:state.offerAdded
  }));
}
function restore(){
  try { const s=JSON.parse(localStorage.getItem('smartTrolleyPrototype'));
    if(!s) return;
    products.forEach((p,i)=>p.qty=Number.isFinite(s.qty?.[i])?s.qty[i]:p.qty);
    state.parking=s.parking||state.parking; state.shared=!!s.shared;
    state.route=s.route||state.route; state.offerAdded=!!s.offerAdded;
  } catch(e) {}
}
restore();
subtotal=()=>products.reduce((sum,p)=>sum+(p.price*p.qty),0);
savings=()=>1.90+(state.offerAdded?1.20:0);
total=()=>Math.max(0,subtotal()-savings());
count=()=>products.reduce((sum,p)=>sum+p.qty,0);
function itemTotal(p){return p.price*p.qty}
function modifyQty(i,amount){
  const p=products[i]; p.qty=Math.max(0,p.qty+amount);
  if(p.name==='Apples') { state.apples=p.qty; if(p.qty===3) state.mismatch=false; }
  state.paid=false; state.verified=false; state.exitUsed=false; persist(); render();
}
function simulateScan(){
  const available=products.map((p,i)=>({p,i})).filter(x=>x.p.qty===0 || x.p.name!=='Apples');
  const chosen=available[state.scanIndex++%available.length];
  chosen.p.qty++; state.paid=false; state.verified=false; state.exitUsed=false; persist();
  toast(`Camera + scale confirmed: ${chosen.p.name} added`); render();
}
function addOffer(){
  if(!state.offerAdded){ state.offerAdded=true; products.push({name:'Pasta Sauce',emoji:'🍅',price:1.20,aisle:'Grocery',detail:'Shared list offer · Barcode confirmed',qty:1}); }
  persist(); toast('Pasta sauce added and offer route selected'); state.route='offers'; go('route');
}
function startRoute(){ state.routeStarted=true; state.routeStep=Math.min(5,state.routeStep+1); render(); toast(state.routeStep===5?'Route complete — head to checkout':'Navigation updated to your next stop'); }
function shareBasket(){ state.shared=!state.shared; if(state.shared && !products.some(p=>p.name==='Bananas')) products.push({name:'Bananas',emoji:'🍌',price:1.10,aisle:'Produce',detail:'Added by Steven on shared list',qty:1}); persist(); toast(state.shared?'Steven connected and added bananas':'Shared basket disconnected'); render(); }
function saveParkingLive(){ state.parking=document.getElementById('parking').value.trim()||'B428'; state.parkingSaved=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' today'; persist(); toast('Parking space saved for this shopping day'); render(); }
function completePayment(){
  if(state.mismatch){ toast('Resolve the apple camera/scale check first'); go('basket'); return; }
  if(count()===0){ toast('Add an item before paying'); go('basket'); return; }
  state.paid=true; state.verified=true; state.exitUsed=false; toast('Demo Smart Pay approved — exit pass ready'); render();
}
async function copyReceipt(){
  const lines=products.filter(p=>p.qty).map(p=>`${p.name} x${p.qty}  ${money(itemTotal(p))}`);
  const text=['TESCO Smart Trolley receipt','',...lines,`Clubcard savings -${money(savings())}`,`TOTAL ${money(total())}`].join('\n');
  try { await navigator.clipboard.writeText(text); toast('Receipt copied to clipboard'); } catch(e) { toast('Receipt ready to copy from this screen'); }
}
function resetShop(){
  products.splice(6); products.forEach(p=>p.qty=p.name==='Apples'?2:1);
  Object.assign(state,{page:'home',details:false,mismatch:true,apples:2,routeStarted:false,routeStep:0,offerAdded:false,paid:false,verified:false,exitUsed:false,carRoute:false,lowBattery:false});
  persist(); toast('New demo shopping session started'); render();
}

home=()=>`${header('Smart Trolley','A touchscreen shopping companion for this visit')}
<section class="hero"><h2>🛒 Shop smarter.</h2><p>Try the complete prototype: scan items, amend quantities, resolve a camera/scale discrepancy, claim an offer, pay, verify and leave through the simulated exit gate.</p><div class="actions"><button class="btn" onclick="go('basket')">Open live basket</button><button class="btn secondary" onclick="resetShop()">Reset demo</button></div></section>
<div class="grid" style="margin-top:16px"><div class="card"><h2>Clubcard & savings</h2><div class="big">${money(savings())}</div><div class="muted">live Clubcard saving this shop · 12,840 points</div><div class="ok">${state.offerAdded?'Pasta-sauce offer applied: extra £1.20 saved.':'There is another £1.20 offer available on your route.'}</div></div><div class="card"><h2>Today's parking memory</h2><p class="muted">Held for this shopping session/day only, then automatically forgotten.</p><div class="actions"><input class="input" id="parking" value="${state.parking}" aria-label="Parking space"><button class="btn secondary" onclick="saveParkingLive()">Save</button></div><p>🚗 Space <b>${state.parking}</b> · saved ${state.parkingSaved}</p></div></div>
<div class="grid3" style="margin-top:16px"><div class="card"><h3>📍 Indoor position</h3><span class="pill green">Excellent</span><p class="muted">Aisle ${2+state.routeStep} · 2.3 m accuracy<br>Position changes as you continue the route.</p></div><div class="card"><h3>👥 Shared basket</h3><p class="muted">${state.shared?'Steven’s phone connected ✓ · Bananas added':'Connect a shopper to demonstrate a shared list.'}</p><button class="btn secondary" onclick="shareBasket()">${state.shared?'Disconnect shopper':'Connect shopper'}</button></div><div class="card"><h3>🔋 Trolley health</h3><p class="muted">${state.lowBattery?'Battery low — return to a charging bay after shopping.':'84% battery · approximately six hours remaining.'}</p><button class="btn secondary" onclick="state.lowBattery=!state.lowBattery;render()">Toggle battery alert</button></div></div>`;

route=()=>{const modes={fast:['⚡ Fastest','11 min','420 m'],offers:['💷 Best for offers','13 min','510 m'],walk:['🚶 Least walking','15 min','360 m'],list:['🧭 Follow shopping list','12 min','440 m']};const m=modes[state.route];const stops=['Produce · Aisle 2','Dairy · Aisle 4','Meat · Aisle 7','Grocery · Aisle 10','Breakfast · Aisle 12','Checkout'];return `${header('Shopping route','Choose how the trolley optimises your trip')}<div class="grid"><div class="card"><h2>Route mode</h2><div class="list">${Object.entries(modes).map(([id,x])=>`<div class="row"><span><b>${x[0]}</b><br><span class="muted">${x[1]} · ${x[2]}</span></span><button class="btn ${state.route===id?'':'secondary'}" onclick="state.route='${id}';persist();render()">${state.route===id?'Selected':'Choose'}</button></div>`).join('')}</div><div class="ok"><b>${state.routeStep>=5?'Route complete':`Next stop: ${stops[state.routeStep]}`}</b><br><span class="muted">Progress ${state.routeStep}/5 · route adapts when offers or shared-list items are added.</span></div><br><button class="btn" onclick="startRoute()">${state.routeStarted?'Mark next stop reached':'Start navigation'}</button></div><div class="card"><h2>${m[0]}</h2><div class="map"><div class="aisle a1">Aisles 1–4</div><div class="aisle a2">Aisles 5–9</div><div class="aisle a3">Aisles 10–14</div><div class="you" style="left:${18+state.routeStep*13}%"></div><div class="route-line"></div></div><p><span class="pill">You are here</span> &nbsp; <span class="pill green">${state.routeStep>=5?'Checkout':'Next: '+stops[state.routeStep]}</span></p><p class="muted">Estimated time ${m[1]} · Distance ${m[2]}</p></div></div>`};

basket=()=>`${header('Your basket','Use the controls below to simulate scans and correct the basket')}<div class="grid"><div class="card"><h2>Live basket · ${count()} items</h2><div class="list">${products.filter(p=>p.qty).map(p=>{const i=products.indexOf(p);return `<div class="row"><span>${p.emoji} <b>${p.name}</b><br>${state.details?`<span class="muted">${p.detail}</span>`:`<span class="muted">${p.aisle}</span>`}</span><span><button class="btn secondary" onclick="modifyQty(${i},-1)">−</button> <b>${p.qty}</b> <button class="btn secondary" onclick="modifyQty(${i},1)">+</button> &nbsp;<b>${money(itemTotal(p))}</b></span></div>`}).join('')||'<p class="muted">Your basket is empty. Run a simulated scan to add an item.</p>'}</div><br><div class="actions"><button class="btn secondary" onclick="state.details=!state.details;render()">${state.details?'Hide detection details':'How was this added?'}</button><button class="btn" onclick="simulateScan()">Simulate camera scan</button></div></div><div class="card"><h2>Basket confidence</h2><div class="row"><span>📷 Camera recognition</span><span class="check">✓ tracked</span></div><div class="row"><span>⚖️ Basket scale</span><span class="${state.mismatch?'fail':'check'}">${state.mismatch?'Review required':'✓ matched'}</span></div><div class="row"><span>🏷️ Barcode scans</span><span class="check">✓ confirmed</span></div>${state.mismatch?`<div class="notice"><b>⚠ Something doesn't look right</b><p>Camera detected <b>2 apples</b>, but the basket weight suggests <b>3</b>.</p><div class="actions"><button class="btn" onclick="products.find(p=>p.name==='Apples').qty=3;state.apples=3;state.mismatch=false;persist();toast('3 apples confirmed');render()">Confirm 3 apples</button><button class="btn secondary" onclick="state.details=true;render()">Review detections</button></div></div>`:`<div class="ok"><b>✓ Basket verified</b><br>Camera, barcode and basket-scale readings now agree.</div>`}<hr style="border:0;border-top:1px solid var(--border);margin:17px 0"><div class="row"><span>Clubcard savings</span><b>−${money(savings())}</b></div><div class="row total"><span>Total</span><span>${money(total())}</span></div><br><button class="btn" onclick="go('pay')">Continue to payment</button></div></div>`;

offers=()=>`${header('Potential savings','Apply an offer and see the receipt update immediately')}<div class="grid"><div class="card"><h2>💷 You could save £1.20 more</h2><p class="muted">Add one selected pasta sauce to unlock the 3-for-£4 offer. It will be put on your route and added to the live basket.</p><div class="big">${money(savings())}</div><div class="muted">live saving so far today</div><br><button class="btn ${state.offerAdded?'secondary':''}" onclick="addOffer()">${state.offerAdded?'Offer applied ✓':'Add to route & basket'}</button></div><div class="card"><h2>Available Clubcard prices</h2><div class="list"><div class="row"><span><b>Cereal Clubcard Price</b><br><span class="muted">Corn Flakes</span></span><b>Save 50p</b></div><div class="row"><span><b>Chicken Clubcard Price</b><br><span class="muted">Chicken Breast</span></span><b>Save £1.00</b></div><div class="row"><span><b>3 for £4</b><br><span class="muted">Selected pasta sauces</span></span><b>Save £1.20</b></div></div></div></div>`;

pay=()=>`${header('Pay & live receipt','Payment is simulated locally; no real financial information is collected')}<div class="grid"><div class="card receipt"><h2>TESCO</h2><div class="muted">Smart Trolley Receipt · ${new Date().toLocaleDateString()}</div><br>${products.filter(p=>p.qty).map(p=>`<div class="row"><span>${p.name} × ${p.qty}</span><span>${money(itemTotal(p))}</span></div>`).join('')}<div class="row"><span>Clubcard savings</span><span>-${money(savings())}</span></div><div class="row total"><span>TOTAL</span><span>${money(total())}</span></div><div class="row"><span>Clubcard points</span><span>+${Math.round(total())}</span></div><br><span class="pill green">${state.paid?'Paid by demo Smart Pay ✓':'Awaiting demo payment'}</span></div><div class="card"><h2>Payment & verification</h2><p class="muted">The exit pass activates only after the live basket has passed verification.</p><div class="row"><span>💳 Smart Pay</span><span class="${state.paid?'check':'muted'}">${state.paid?'✓ paid':'Ready'}</span></div><div class="row"><span>🪪 Age checks</span><span class="check">✓ none required</span></div><div class="row"><span>🧾 Basket contents</span><span class="${state.mismatch?'fail':'check'}">${state.mismatch?'Needs review':'✓ matched'}</span></div><br><button class="btn ${state.paid?'secondary':''}" onclick="completePayment()">${state.paid?'Payment complete':'Pay demo total '+money(total())}</button><div class="ok"><b>Receipt actions</b><br><br><div class="actions"><button class="btn secondary" onclick="copyReceipt()">Copy receipt</button><button class="btn secondary" onclick="state.receiptSent=true;toast('Demo email receipt sent');render()">${state.receiptSent?'Email sent ✓':'Email receipt'}</button></div></div></div></div>`;

exit=()=>{const ready=state.paid&&state.verified&&!state.exitUsed;return `${header('Exit verification','The secure pass is usable until the end of today’s trading day')}<div class="exit-hero"><h2>${state.exitUsed?'✓ EXIT VERIFIED':ready?'🟢 READY TO EXIT':'⚠ ASSISTANCE REQUIRED'}</h2><p>${state.exitUsed?'Thank you for shopping at Tesco. The pass has been marked used for this session.':ready?'Payment, camera, scale and basket contents have all been verified. Present this pass to the exit gate.':'Resolve the basket check and complete demo payment before the exit pass can activate.'}</p>${ready?`<div class="qr">${Array.from({length:169},(_,i)=>'<i style="opacity:'+((i*17+i*i)%5?'1':'0')+'"></i>').join('')}</div><b>ST-428-019-${new Date().toISOString().slice(0,10).replaceAll('-','')}</b><p class="muted">Linked to this completed trolley session · valid today</p><button class="btn green" onclick="state.exitUsed=true;toast('Exit scanner accepted your pass');render()">Simulate exit-gate scan</button>`:''}</div><div class="grid3" style="margin-top:16px"><div class="card"><h3>📷 Camera</h3><span class="${ready||state.exitUsed?'check':'fail'}">${ready||state.exitUsed?'✓ verified':'Pending'}</span></div><div class="card"><h3>⚖️ Weight</h3><span class="${ready||state.exitUsed?'check':'fail'}">${ready||state.exitUsed?'✓ verified':'Pending'}</span></div><div class="card"><h3>💳 Payment</h3><span class="${state.paid?'check':'fail'}">${state.paid?'✓ verified':'Pending'}</span></div></div>${state.exitUsed?'<div class="actions" style="margin-top:16px"><button class="btn" onclick="go(\'car\')">Find my car</button><button class="btn secondary" onclick="resetShop()">Start a new demo shop</button></div>':''}`};

car=()=>`${header('Find your car','Parking space is retained only for this visit')}<div class="grid"><div class="card"><h2>🚗 Your car</h2><div class="big">${state.parking}</div><p class="muted">Saved ${state.parkingSaved}. This record is automatically removed after today.</p><div class="actions"><button class="btn" onclick="state.carRoute=true;toast('Walking route to your car started');render()">Navigate to car</button><button class="btn secondary" onclick="state.parking='—';persist();toast('Parking space forgotten');render()">Forget parking space</button></div></div><div class="card"><h2>${state.carRoute?'Walking route active':'Car park route'}</h2><div class="map"><div class="aisle a1">Entrance</div><div class="aisle a2">Level B</div><div class="aisle a3">Space ${state.parking}</div><div class="you"></div><div class="route-line"></div></div><p class="muted">${state.carRoute?'Follow the green route — approximately 2 minutes remaining.':'About 2 minutes’ walk from the exit.'}</p></div></div>`;

render=()=>{nav();status();document.getElementById('screen').innerHTML=({home,route,basket,offers,pay,exit,car})[state.page]();document.getElementById('bottom').innerHTML=`<span class="summary">🛒 ${count()} items · ${money(total())} · <span class="check">● ACTIVE</span></span><button class="btn secondary" onclick="go('basket')">Basket</button><button class="btn secondary" onclick="go('route')">Route</button><button class="btn secondary" onclick="go('offers')">Offers</button><button class="btn" onclick="go('pay')">Checkout</button>`};
render();
</script>
<script>
/* Neutral presentation layer: all customer-facing retailer language is generic. */
const prototypeRender = render;
const prototypeToast = toast;
function neutraliseBranding(root=document.body) {
  const replacements = [
    [/Tesco Extra/gi, 'Demo Store'],
    [/Tesco/gi, 'Smart Store'],
    [/Clubcard/gi, 'Member Rewards'],
    [/Smart Pay/gi, 'Trolley Pay'],
    [/Sample Clubcard/gi, 'Sample member account']
  ];
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(node => replacements.forEach(([find, replace]) => node.nodeValue=node.nodeValue.replace(find, replace)));
}
render = () => { prototypeRender(); neutraliseBranding(); };
toast = message => prototypeToast(String(message)
  .replace(/Clubcard/gi, 'Member Rewards')
  .replace(/Smart Pay/gi, 'Trolley Pay')
  .replace(/Tesco/gi, 'Smart Store'));
render();
</script>
</body>
</html>
